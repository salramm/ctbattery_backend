name: Build & push

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          push: true
          # prod compose pulls :latest, dev compose pulls :dev — build once, tag both.
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ctbs-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/ctbs-backend:dev
            ${{ secrets.DOCKER_USERNAME }}/ctbs-backend:${{ github.sha }}
